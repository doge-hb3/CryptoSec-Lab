[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cryptosec-lab"
version = "0.1.0"
description = "Reproducible cryptography and password security learning labs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=46,<51", "argon2-cffi>=25.1,<26", "psutil>=7,<8"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10", "ruff>=0.14,<1", "build>=1.3,<2",
    "hatchling>=1.27,<2", "editables>=0.5,<1",
]

[project.scripts]
cryptosec = "cryptosec_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptosec_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
